name: Tri-SACTA V13.2 Lightweight Regression

on:
  push:
    branches:
      - "research/v13.2-final-systems-validation-release-candidate"
  pull_request:
    branches:
      - "main"

jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pandas scikit-learn --index-url https://download.pytorch.org/whl/cpu
          pip install pandas scikit-learn
      - name: Run V13.2 Synthetic Evaluator, Runtime Safety, and Adversarial Verifier Tests
        run: |
          python -m unittest -v tests/test_v13_2_evaluator_regression.py tests/test_v13_2_runtime_safety.py tests/test_v13_2_verifier_adversarial.py
      - name: Run Dry-Run Synthetic Gated Preflight
        run: |
          python scripts/v13_2_run_phase2_holdout.py --dry-run-dev --synthetic
